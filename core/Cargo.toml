[package]
name = "dry4rust-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The analysis behind cargo-dry4rust: duplicate and near-duplicate code in Rust, found by normalising the AST"
documentation = "https://docs.rs/dry4rust-core"
readme = "README.md"
keywords = ["duplicates", "code-quality", "lint", "ast", "static-analysis"]
categories = ["development-tools"]

autotests = false

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[lib]
name = "dry4rust"
path = "src/lib.rs"

# The technology-free analysis: no file system, process, clap, serde or
# walkdir.
[dependencies]
proc-macro2 = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }

# No `unsafe` in any target, tests included; the crate root says so as well.
[lints.rust]
unsafe_code = "forbid"

# Upstream's lint configuration, kept. pedantic and nursery at warn are
# stricter than this family's stage 1, which runs -D warnings on the default
# lints only, and the tree already satisfies them.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
too_long_first_doc_paragraph = "allow"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
implicit_hasher = "allow"
option_if_let_else = "allow"
useless_let_if_seq = "allow"
