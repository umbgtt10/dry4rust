[package]
name = "xtask"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Gate orchestration for the dry4rust workspace"
publish = false

autotests = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# The same configuration core carries. The crate that runs the gates is held to
# the bar it enforces, rather than being the one package in the workspace that
# is measured more loosely than the code it measures.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
