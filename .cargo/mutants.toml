# What cargo-mutants mutates here, for a hand run and for sentinel4rust alike:
# dry4rust-core, the technology-free analysis, against core's own tests only.
# cli (clap, the file system, TOML, JSON, stdout), validation (the binary end
# to end) and xtask (the gates) are not mutated. From the workspace root every
# package is selected and this glob keeps core's files; the baseline then tests
# only the mutated package, and each mutant runs that package's tests, which
# test_workspace says outright.
examine_globs = ["core/src/**/*.rs"]
test_workspace = false
