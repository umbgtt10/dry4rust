[workspace]
resolver = "2"
members = ["core", "cli", "validation", "xtask"]

# The fixture crates are analysis input, not code this workspace builds. They
# carry manifests because dry4rust is pointed at them as real packages, and
# they are excluded rather than made members so a deliberately-duplicated
# fixture never has to satisfy the workspace's own build.
#
# Excluding them is also what stopped `cargo package` shipping a test suite it
# could not run: cargo skips any subdirectory holding a Cargo.toml, so while
# the corpus lived under core/tests/ it was dropped from the tarball while the
# tests that read it were kept.
exclude = ["fixture"]

# One version for every member: the two published crates release together.
[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/umbgtt10/dry4rust"
authors = [
    "Matjaz Domen Pecan <matjaz.pecan@gmail.com>",
    "Umberto Gotti <umberto.gotti@umbertogotti.dev>",
]

# Declared once here; every member takes them with `.workspace = true`, so a
# version is bumped in one place and no two members can disagree.
[workspace.dependencies]
# The published crates, taken by path so cli and validation drive the same
# code the gates measure rather than whatever is on crates.io. core carries its
# version because a published cli has to name a registry version of it.
cargo-dry4rust = { path = "cli" }
dry4rust-core = { path = "core", version = "0.4.0" }
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
# Without std: core is `no_std`, and thiserror then implements
# `core::error::Error`.
thiserror = { version = "2", default-features = false }
toml = "0.8"
walkdir = "2"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# A dependency cargo-shear cannot see used, each with its reason. Stage 2
# refuses an ignored entry that has none.
[workspace.metadata.cargo-shear]
ignored = ["proc-macro2"]
reasons = { proc-macro2 = "declared for its span-locations feature: core reads line numbers from syn's spans, which only that feature gives them; no file imports it" }
